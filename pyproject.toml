[tool.poetry]
name = "tutoriel-assistant-conversationel"
version = "0.1.0"
description = "Tutoriel Assistant Conversationnel"
authors = ["MAXG"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
pre-commit = "^3.7.0"
python-dotenv = "^1.0.1"
langchain = "^0.1.15"
openai = "^1.16.2"
langchain-openai = "^0.1.3"
boto3 = "^1.34.85"
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = 'black'

[tool.flake8]
max-line-length = 88
exclude = '.venv'
